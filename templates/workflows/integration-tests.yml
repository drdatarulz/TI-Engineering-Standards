# Integration tier — REQUIRED pre-merge check. Real infrastructure via Testcontainers.
# See standards/testing.md → CI/CD Testing Tiers.
#
# This and fast-tests are the checks the orchestrator's merge gate requires. No branch
# protection is needed: before merging, the v6 orchestrator brings a PR up to date with main
# and waits for these checks again if main has moved since they ran. Both workflows also run
# on push to main, which is the "is main red?" signal.
#
# FILL IN: {ProjectName} → your solution/project name (see templates/workflows/README.md).
name: integration-tests

on:
  pull_request:
    branches: [main]
  # Also run after every merge to main, so a broken main is visible (the "is main red?"
  # signal the v6 orchestrator and ci-fix watch for).
  push:
    branches: [main]

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore {ProjectName}.sln

      - name: Build
        run: dotnet build {ProjectName}.sln --no-restore --configuration Release

      # Testcontainers starts SQL Server (and any other real infra) as sibling containers
      # on the runner's host Docker — no Docker-in-Docker. The runner user must reach Docker.
      - name: Run integration tests
        run: dotnet test tests/{ProjectName}.Integration.Tests/ --no-build --configuration Release
